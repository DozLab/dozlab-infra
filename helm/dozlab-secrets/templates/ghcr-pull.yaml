{{- if .Values.ghcrPull.enabled }}
{{- $g := .Values.ghcrPull }}
{{- $existing := lookup "v1" "Secret" .Values.sourceNamespace $g.sourceSecret }}
# The source values. Created empty; on upgrade the values already in the cluster are rendered back
# (lookup), so Helm never overwrites what was set by hand. Kept on uninstall.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $g.sourceSecret }}
  namespace: {{ .Values.sourceNamespace }}
  labels:
    {{- include "dozlab-secrets.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
{{- with (and $existing $existing.data) }}
data:
  {{- toYaml . | nindent 2 }}
{{- end }}
{{- range $ns := $g.namespaces }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $g.targetName }}
  namespace: {{ $ns }}
  labels:
    {{- include "dozlab-secrets.labels" $ | nindent 4 }}
spec:
  refreshInterval: {{ $.Values.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $.Values.store.name }}
  target:
    name: {{ $g.targetName }}
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        # ESO's template, not Helm's: the braces are passed through as-is.
        .dockerconfigjson: {{ printf `{"auths":{%q:{"username":"{{ .username }}","password":"{{ .token }}","auth":"{{ printf "%%s:%%s" .username .token | b64enc }}"}}}` $g.registry | squote }}
  data:
    - secretKey: username
      remoteRef:
        key: {{ $g.sourceSecret }}
        property: username
    - secretKey: token
      remoteRef:
        key: {{ $g.sourceSecret }}
        property: token
{{- end }}
{{- end }}
