# Reads Secrets in {{ .Values.sourceNamespace }} through the Kubernetes API, as {{ .Values.store.readerServiceAccount }}.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.store.name }}
  labels:
    {{- include "dozlab-secrets.labels" . | nindent 4 }}
spec:
  conditions:
    - namespaces:
        {{- include "dozlab-secrets.storeNamespaces" . | nindent 8 }}
  provider:
    kubernetes:
      remoteNamespace: {{ .Values.sourceNamespace }}
      server:
        url: https://kubernetes.default.svc
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
          namespace: {{ .Values.sourceNamespace }}
      auth:
        serviceAccount:
          name: {{ .Values.store.readerServiceAccount }}
          namespace: {{ .Values.sourceNamespace }}
