{{- $o := .Values.openbao }}
# ESO reads OpenBao's kv-v2 mount, logging in with its own service account (kubernetes auth).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.store.name }}
  labels:
    {{- include "dozlab-secrets.labels" . | nindent 4 }}
spec:
  conditions:
    - namespaces:
        {{- include "dozlab-secrets.storeNamespaces" . | nindent 8 }}
  provider:
    vault:
      server: {{ $o.address }}
      path: {{ $o.kvPath }}
      version: v2
      auth:
        kubernetes:
          mountPath: {{ $o.authMount }}
          role: {{ $o.role }}
          serviceAccountRef:
            name: {{ .Values.store.serviceAccount.name }}
            namespace: {{ .Values.store.serviceAccount.namespace }}
