{{- $o := .Values.openbao }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $o.namespace }}
  labels:
    {{- include "dozlab-secrets.labels" . | nindent 4 }}
  annotations:
    # Deleting the namespace deletes OpenBao's data volume.
    helm.sh/resource-policy: keep
---
{{- /* 64 hex characters = 32 bytes, from a random 64-character string. */}}
{{- $unseal := lookup "v1" "Secret" $o.namespace $o.unsealKeySecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $o.unsealKeySecret }}
  namespace: {{ $o.namespace }}
  labels:
    {{- include "dozlab-secrets.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if and $unseal $unseal.data $unseal.data.key }}
  key: {{ $unseal.data.key }}
  {{- else }}
  key: {{ randAlphaNum 64 | sha256sum | b64enc }}
  {{- end }}
---
{{- $admin := lookup "v1" "Secret" $o.namespace $o.adminSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $o.adminSecret }}
  namespace: {{ $o.namespace }}
  labels:
    {{- include "dozlab-secrets.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  username: {{ "admin" | b64enc }}
  {{- if and $admin $admin.data $admin.data.password }}
  password: {{ $admin.data.password }}
  {{- else }}
  password: {{ randAlphaNum 32 | b64enc }}
  {{- end }}
