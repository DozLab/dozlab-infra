{{- if .Values.api.enabled }}
{{- $c := dict "ctx" $ "component" "api" }}
{{- $v := .Values.api }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dozlab.componentName" $c }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dozlab.componentLabels" $c | nindent 4 }}
spec:
  replicas: {{ $v.replicaCount }}
  selector:
    matchLabels:
      {{- include "dozlab.selectorLabels" $c | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dozlab.selectorLabels" $c | nindent 8 }}
      {{- with $v.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "dozlab.serviceAccountName" $c }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      containers:
      - name: api
        image: {{ include "dozlab.image" $c }}
        imagePullPolicy: {{ $v.image.pullPolicy }}
        env:
        - name: PORT
          value: {{ $v.port | quote }}
        {{- range $k, $val := $v.env }}
        - name: {{ $k }}
          value: {{ $val | quote }}
        {{- end }}
        envFrom:
        - secretRef:
            name: {{ required "api.existingSecret is required (DB_PASSWORD, JWT_SECRET, RABBITMQ_URL)" $v.existingSecret }}
        ports:
        - name: http
          containerPort: {{ $v.port }}
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 2
          periodSeconds: 5
        resources:
          {{- toYaml $v.resources | nindent 10 }}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
      {{- with $v.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $v.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $v.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dozlab.componentName" $c }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dozlab.componentLabels" $c | nindent 4 }}
spec:
  type: {{ $v.service.type }}
  selector:
    {{- include "dozlab.selectorLabels" $c | nindent 4 }}
  ports:
  - name: http
    port: {{ $v.service.port }}
    targetPort: http
{{- if $v.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "dozlab.componentName" $c }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dozlab.componentLabels" $c | nindent 4 }}
  {{- with $v.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $v.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with $v.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
  - host: {{ $v.ingress.host | quote }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ include "dozlab.componentName" $c }}
            port:
              name: http
{{- end }}
{{- end }}
