{{- if and .Values.api.enabled .Values.api.migrations.enabled }}
{{- $c := dict "ctx" $ "component" "api-migrations" "imageComponent" "api" }}
{{- $m := .Values.api.migrations }}
# Applies the API's migrations and sets up its database logins before the release installs or
# upgrades (dozlab-api cmd/migrate; safe to run again). A failure stops the install or upgrade.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "dozlab.componentName" $c }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dozlab.componentLabels" $c | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ $m.backoffLimit }}
  activeDeadlineSeconds: {{ $m.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "dozlab.componentLabels" $c | nindent 8 }}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      containers:
      - name: migrate
        image: {{ include "dozlab.image" $c }}
        imagePullPolicy: {{ .Values.api.image.pullPolicy }}
        command: ["/usr/local/bin/migrate"]
        env:
        {{- range $k, $val := $m.env }}
        - name: {{ $k }}
          value: {{ $val | quote }}
        {{- end }}
        envFrom:
        - secretRef:
            name: {{ required "api.migrations.existingSecret is required (PGPASSWORD and the logins' passwords)" $m.existingSecret }}
        resources:
          {{- toYaml $m.resources | nindent 10 }}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
{{- end }}
