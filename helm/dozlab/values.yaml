# Default values for the dozlab chart.
# Everything installs into the release namespace (helm install -n <ns> --create-namespace).

nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

crds:
  # Install/upgrade the LabSession CRD with the chart. The CRD is kept on
  # `helm uninstall` (helm.sh/resource-policy: keep) so LabSessions aren't deleted.
  install: true

# Namespace the API creates LabSessions in. dozlab-api hard-codes "default" today;
# this only sets where the API's RBAC is granted.
labSessions:
  namespace: default

controller:
  enabled: true
  replicaCount: 3
  image:
    repository: ghcr.io/dozlab/dozlab-controller
    # Defaults to the chart appVersion.
    tag: ""
    pullPolicy: IfNotPresent
  # Pod selector. Empty uses the chart's app.kubernetes.io/* labels. A Deployment's selector
  # can't change, so to adopt a controller deployed without Helm, set its selector here
  # (deploy/deployment.yaml uses {app: dozlab-controller}).
  selectorLabels: {}
  leaderElect: true
  maxConcurrentReconciles: 10
  syncPeriod: 10m
  cacheSyncTimeout: 2m
  gracefulShutdownTimeout: 30s
  # Lab pod settings (see dozlab-controller README "Lab pod settings").
  labPod:
    vmImage: ""          # required: Firecracker image (dozlab-infra)
    initImage: ""        # required: rootfs init image (dozlab-rootfs-manager init-setup)
    terminalImage: ""    # required: terminal sidecar image (dozlab-terminal-sidecar)
    sshUser: root
    vmDiskSize: 4Gi
    # StorageClass for session PVCs; empty uses the cluster default.
    storageClass: ""
    # Session Ingresses (code-server and terminal, by path). ingressMiddleware is the Traefik
    # Middleware that strips the session prefix, as <namespace>-<name>@kubernetescrd.
    ingressClass: traefik
    ingressMiddleware: ""
    # Public URL of the ingress controller, used in session endpoints; empty gives paths only.
    publicBaseURL: ""
    # Secrets in the sessions' namespace that lab pods pull images with, e.g. [ghcr-pull] for the
    # private dozlab-terminal (written by the dozlab-secrets chart's ExternalSecret). Empty: none.
    imagePullSecrets: []
  # Secret with key `url` (amqp://...) for publishing LabSession phase changes.
  # Optional: without it the controller doesn't publish.
  rabbitmqSecret: dozlab-controller-rabbitmq
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  serviceAccount:
    create: true
    name: ""

api:
  enabled: true
  # One replica: the node is small. The audit spool (below) is per pod.
  replicaCount: 1
  image:
    repository: ghcr.io/dozlab/dozlab-api
    tag: ""
    pullPolicy: IfNotPresent
  port: 8080
  # Non-secret settings, passed as env vars. The API logs in as dozlab_app, which the migration
  # hook creates with read and write on the tables only (dozlab-api cmd/migrate).
  env:
    DB_HOST: postgres.dozlab.svc
    DB_PORT: "5432"
    DB_NAME: dozlab
    DB_USER: dozlab_app
    GIN_MODE: release
  # Required: an existing Secret loaded with envFrom. It must hold JWT_SECRET, DB_PASSWORD and
  # RABBITMQ_URL, and may hold AUDIT_DATABASE_URL and AUDIT_READ_DATABASE_URL. The chart never
  # creates credentials (the dozlab-secrets chart's ExternalSecret writes it).
  existingSecret: dozlab-api
  # Where audit entries wait while the audit store is unreachable (AUDIT_SPOOL_DIR): an emptyDir,
  # so a restarted pod loses entries that hadn't reached the store yet.
  auditSpool:
    sizeLimit: 256Mi
  # cmd/migrate from the API image, as a Job before every install and upgrade (Helm hook): applies
  # the SQL migrations and sets up the logins (dozlab_app, the audit store's). It connects as the
  # Postgres superuser, whose password only this Job gets.
  migrations:
    enabled: true
    # Required: PGPASSWORD (superuser), APP_DB_PASSWORD, AUDIT_OWNER_PASSWORD,
    # AUDIT_WRITER_PASSWORD, AUDIT_READER_PASSWORD.
    existingSecret: dozlab-api-migrate
    env:
      PGHOST: postgres.dozlab.svc
      PGPORT: "5432"
      PGUSER: postgres
      PGSSLMODE: disable
      DB_NAME: dozlab
      APP_DB_USER: dozlab_app
    backoffLimit: 2
    activeDeadlineSeconds: 300
    resources:
      requests:
        cpu: 50m
        memory: 32Mi
      limits:
        memory: 128Mi
  service:
    type: ClusterIP
    port: 80
  # Routes `path` (on `host`, or on any host when empty) to the API, unchanged: the API serves
  # /api/v1. On k3s: className traefik, host empty, so the Funnel URL reaches it through Traefik.
  ingress:
    enabled: false
    className: ""
    annotations: {}
    host: ""
    path: /api
    tls: []
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: "1"
      memory: 256Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  serviceAccount:
    create: true
    name: ""
