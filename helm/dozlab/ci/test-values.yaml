# Values used by CI (helm lint / template / kubeconform). Not for real installs.
controller:
  labPod:
    vmImage: ghcr.io/dozlab/dozlab-firecracker:ci
    initImage: ghcr.io/dozlab/dozlab-init:ci
    terminalImage: ghcr.io/dozlab/dozlab-terminal:ci
    storageClass: local-path
    ingressMiddleware: default-dozlab-strip-session-prefix@kubernetescrd
    publicBaseURL: https://dozlab.example
    imagePullSecrets: [ghcr-pull]
  selectorLabels:
    app: dozlab-controller
api:
  ingress:
    enabled: true
    className: traefik
