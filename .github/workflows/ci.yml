# shellcheck the scripts, build the Firecracker image on PRs and push it to GHCR from main and
# from v<semver> tags.
# The runner only builds the image: it has no KVM, so labs boot on the node, where Flux rolls
# out the newest main-<sha>-<run> tag (dozlab-api docs/decision.md, "CI on GitHub Actions, CD
# with Flux", which also has the tags and labels). The chart has its own workflow and tags
# (helm-chart.yml, chart-v<semver>).
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']   # path filters don't apply to tag pushes
    paths: ['*.sh', 'Dockerfile', 'kernel/**', '.github/workflows/ci.yml']
  pull_request:
    paths: ['*.sh', 'Dockerfile', 'kernel/**', '.github/workflows/ci.yml']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/dozlab/dozlab-firecracker

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -S warning ./*.sh

  image:
    needs: shellcheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # Tags, all immutable except the semver major/minor ones:
      #   main-<sha7>-<run>  main; Flux's ImagePolicy orders by the run number
      #   sha-<full sha>     main and v* tags; finds the image for a commit
      #   1.2.3, 1.2, 1      v1.2.3 git tags (1 is skipped while the major is 0)
      #   pr-<n>             PRs; built, never pushed
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=main-{{sha}}-${{ github.run_number }},enable={{is_default_branch}}
            type=sha,format=long,enable=${{ github.event_name == 'push' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=ref,event=pr
          # No `latest`: Flux can't see a mutable tag change, and it hides what runs
          flavor: latest=false
          # org.opencontainers.image.{title,description,url,source,version,created,revision,licenses}
          labels: |
            org.opencontainers.image.title=dozlab-firecracker
            org.opencontainers.image.vendor=DozLab
      - uses: docker/setup-buildx-action@v3
      - if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The kernel stage compiles Linux; the gha cache (mode=max keeps that stage) skips it
      # until the kernel version or config changes.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
