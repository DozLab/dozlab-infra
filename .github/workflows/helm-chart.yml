name: Helm chart

# PRs and main: lint + validate each chart. A tag packages one chart, pushes it to GHCR as an
# OCI artifact and attaches it to a GitHub release: chart-v<version> releases helm/dozlab,
# dozlab-secrets-v<version> releases helm/dozlab-secrets. See each chart's README.
on:
  pull_request:
    paths:
      - helm/**
      - crd-definition.yaml
      - .github/workflows/helm-chart.yml
  push:
    branches: [main]
    paths:
      - helm/**
      - crd-definition.yaml
      - .github/workflows/helm-chart.yml
    tags: ['chart-v*', 'dozlab-secrets-v*']

permissions:
  contents: read

env:
  HELM_VERSION: v3.15.4
  KUBECONFORM_VERSION: v0.6.7

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chart: [dozlab, dozlab-secrets]
    env:
      CHART: ${{ matrix.chart }}
      CHART_DIR: helm/${{ matrix.chart }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: CRD copy matches crd-definition.yaml
        if: matrix.chart == 'dozlab'
        run: diff -u crd-definition.yaml "$CHART_DIR/files/labsessions.dozlab.io.yaml"

      - name: Chart version bumped
        if: github.event_name == 'pull_request'
        run: |
          base="origin/${{ github.base_ref }}"
          if git diff --quiet "$base"...HEAD -- "$CHART_DIR" crd-definition.yaml; then
            echo "chart unchanged"; exit 0
          fi
          old=$(git show "$base:$CHART_DIR/Chart.yaml" 2>/dev/null | sed -n 's/^version: *//p' || true)
          new=$(sed -n 's/^version: *//p' "$CHART_DIR/Chart.yaml")
          echo "base=$old head=$new"
          if [ -n "$old" ] && [ "$old" = "$new" ]; then
            echo "::error file=$CHART_DIR/Chart.yaml::chart changed but version is still $new; bump it"
            exit 1
          fi

      - name: helm lint
        run: helm lint --strict "$CHART_DIR" -f "$CHART_DIR/ci/test-values.yaml"

      - name: Render and validate with kubeconform
        run: |
          curl -sSfL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C /usr/local/bin kubeconform
          helm template "$CHART" "$CHART_DIR" -n dozlab-system -f "$CHART_DIR/ci/test-values.yaml" \
            | kubeconform -strict -summary -kubernetes-version 1.28.0 -ignore-missing-schemas

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: write   # GitHub release
      packages: write   # push the chart to GHCR
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Chart from the tag; tag matches its Chart.yaml version
        id: version
        run: |
          case "$GITHUB_REF_NAME" in
            chart-v*)          chart=dozlab;         prefix=chart-v ;;
            dozlab-secrets-v*) chart=dozlab-secrets; prefix=dozlab-secrets-v ;;
            *) echo "::error::tag $GITHUB_REF_NAME names no chart"; exit 1 ;;
          esac
          version=$(sed -n 's/^version: *//p' "helm/$chart/Chart.yaml")
          if [ "$GITHUB_REF_NAME" != "$prefix$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match helm/$chart/Chart.yaml version $version"
            exit 1
          fi
          echo "chart=$chart" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Package
        run: helm package "helm/${{ steps.version.outputs.chart }}" -d dist

      - name: Push to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "$GH_TOKEN" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "dist/${{ steps.version.outputs.chart }}-${{ steps.version.outputs.version }}.tgz" "oci://ghcr.io/${owner}/charts"

      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          chart="${{ steps.version.outputs.chart }}"
          version="${{ steps.version.outputs.version }}"
          gh release create "$GITHUB_REF_NAME" "dist/$chart-$version.tgz" \
            --title "$chart chart $version" \
            --generate-notes \
            --notes "helm install $chart oci://ghcr.io/${owner}/charts/$chart --version $version"
